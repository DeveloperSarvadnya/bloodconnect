apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bloodconnect-dev

resources:
  - ../../base

replicas:
  - name: bloodconnect-app
    count: 1 # single replica in dev to keep the free-tier node's resources free

images:
  - name: 2sarvadnya2/bloodconnect
    newTag: latest # overridden at deploy time with the real Jenkins build tag
