# SonarQube project configuration — used by the sonar-scanner CLI,
# invoked from the Jenkins "Code Quality (SonarQube)" stage.

sonar.projectKey=bloodconnect
sonar.projectName=BloodConnect
sonar.projectVersion=1.0

# Source code to analyze
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# Exclude generated/vendor/non-app code from analysis
sonar.exclusions=node_modules/**,.next/**,terraform/**,ansible/**,monitoring/**,public/**

# TypeScript/JS specifics
sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPath=tsconfig.json

# SonarQube server (overridden by Jenkins via -Dsonar.host.url if needed)
sonar.host.url=http://localhost:9000
